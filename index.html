<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <title>Master List</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="frame">
    <div class="editor">
      <textarea id="page" rows="1" aria-label="Daily plans" spellcheck="true" autocomplete="off" autocapitalize="sentences" readonly></textarea>
    </div>
    <div class="actions">
      <button type="button" id="save" disabled>Save</button>
      <button type="button" id="clear" disabled>Clear</button>
    </div>
  </main>
  <p id="status" class="status" role="status" aria-live="polite"></p>
  <script src="./vendor/supabase.js"></script>
  <script src="./supabase-config.js"></script>
  <script src="./script.js"></script>
</body>
</html>
