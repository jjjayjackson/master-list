<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <title>Master List</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="icon" href="./favicon.ico" sizes="32x32">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="frame">
    <div class="editor">
      <textarea id="page" rows="1" aria-label="Daily plans" spellcheck="true" autocomplete="off" autocapitalize="sentences" readonly></textarea>
      <div class="holding" id="holding-view" hidden></div>
    </div>
    <div class="actions">
      <button type="button" id="save" disabled>Save</button>
      <button type="button" id="holding" class="dot" aria-label="Holding area" title="Holding area" aria-pressed="false" disabled></button>
      <button type="button" id="clear" disabled>Clear</button>
    </div>
  </main>
  <button type="button" id="add-holding" class="selection-popup" hidden>Add to holding area.</button>
  <p id="status" class="status" role="status" aria-live="polite"></p>
  <script src="./vendor/supabase.js"></script>
  <script src="./supabase-config.js"></script>
  <script src="./script.js"></script>
</body>
</html>
